[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dynamic-sandbox-chroot"
version = "0.1.0"
description = "Policy-enforced process jail for subagent command execution with path and syscall whitelisting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-dynamic-sandbox-chroot = "agent_dynamic_sandbox_chroot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_dynamic_sandbox_chroot*"]
